<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1630" />
    <meta name="description" content="CraftCV — Advanced resume maker: upload existing PDF/DOCX, edit with high-tech editor, 1 free download then ₹20 Pro lifetime. 50 templates." />
    <meta name="keywords" content="resume maker, CV builder, upload resume, edit resume, free resume, ATS resume, India resume builder" />
    <meta name="author" content="CraftCV" />
    <meta name="robots" content="index, follow" />
    
    <!-- Security Meta Tags — High-tech hardening -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()" />
    
    <!-- Content Security Policy — strict.
         The OCR engine (worker + wasm core + English model) is served from our
         own origin under /ocr/, precisely so it keeps working under this policy.
         script-src/connect-src must not be widened to a CDN. 'wasm-unsafe-eval'
         is required because WebAssembly compilation is CSP-gated too. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://accounts.google.com https://apis.google.com https://checkout.razorpay.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' blob: https://accounts.google.com https://api.razorpay.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" />
    
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="CraftCV — Professional Resume Studio | Upload & Edit | ₹20 Pro" />
    <meta property="og:description" content="Advanced resume maker: upload PDF/DOCX, edit with high-tech editor, 1 free download then ₹20 lifetime Pro. 50 templates." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CraftCV" />
    
    <title>CraftCV — Advanced Resume Maker | Upload & Edit | ₹20 Pro Lifetime</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2148'/%3E%3Ctext x='16' y='22' font-size='16' font-family='Georgia' fill='%23C9D2DE' text-anchor='middle'%3ECV%3C/text%3E%3C/svg%3E" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    
    <!-- Razorpay Checkout (for ₹20 Pro) — loaded only when needed, but preconnect -->
    <link rel="preconnect" href="https://checkout.razorpay.com" />
    <link rel="preconnect" href="https://api.razorpay.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- No inline scripts except module — CSP compliant -->
    <noscript>
      <div style="padding: 20px; text-align: center; font-family: system-ui; background: #0a1630; color: #fff; min-height: 100vh; display: grid; place-items: center;">
        <div>
          <h1>CraftCV requires JavaScript</h1>
          <p>Please enable JavaScript to use the advanced resume builder.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
