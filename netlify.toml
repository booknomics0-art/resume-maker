# Deploy config for Netlify — with high-tech security headers
# Hash routing means no rewrite rules are needed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pin Node 22 so the toolchain (and its npm) stays stable on every deploy.
  NODE_VERSION = "22"
  # Supabase project (cloud accounts + resume database). The anon key is a
  # PUBLIC key by design — it ships in the browser bundle; row-level security
  # protects the data. Never put the service-role key here.
  VITE_SUPABASE_URL = "https://voyvalrnxmdogsllarnz.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZveXZhbHJueG1kb2dzbGxhcm56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjgxOTAsImV4cCI6MjEwNTgwNDE5MH0.Ma0sJbzkoXLhEyDFKEYJdLym8kD9Jlfhfxg6Ev2O0no"
  # Google OAuth Client ID + secret are stored in Supabase Auth, not the
  # static frontend build environment.

# Security headers for all pages — high-tech hardening
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"
    # XSS protection (legacy but still useful)
    X-XSS-Protection = "1; mode=block"
    # Referrer policy — minimal info
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Permissions policy — disable unnecessary features
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), speaker=()"
    # HSTS — force HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Content Security Policy — strict; external script/connect access is disabled.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    # Keep the opener policy compatible with the top-level OAuth tab used by
    # embedded previews; the sign-in page is never loaded inside an iframe.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    # Cache control for HTML — no cache, must revalidate (security)
    Cache-Control = "no-cache, no-store, must-revalidate"
    # Feature-Policy legacy
    Feature-Policy = "camera 'none'; microphone 'none'; geolocation 'none'; payment 'none'"

# OCR engine assets (worker + wasm core + eng model). Not hashed, but stable —
# they change only when the tesseract version is bumped.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Content-Type-Options = "nosniff"
    # Same-origin by design; keep it that way so the strict CSP still applies.
    Cross-Origin-Resource-Policy = "same-origin"

# Cache static assets aggressively (hashed filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# For SPA hash routing — no special rewrite needed, but ensure index.html served
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["admin"] }
  force = false

# Actually, hash routing doesn't need redirects, but we add fallback for direct hits
# Netlify will serve index.html for 404s in SPA mode via _redirects file alternative
# We keep it simple: if file not found, serve index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
