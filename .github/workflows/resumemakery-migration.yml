name: ResumeMakery one-time migration

on:
  push:
    branches:
      - brand/resumemakery-migration
    paths:
      - scripts/migrate-resumemakery.py
      - .github/workflows/resumemakery-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: brand/resumemakery-migration
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply migration
        run: python3 scripts/migrate-resumemakery.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Full regression suite
        run: npm test

      - name: Commit verified migration
        shell: bash
        run: |
          rm -f scripts/migrate-resumemakery.py .github/workflows/resumemakery-migration.yml
          git config user.name "ResumeMakery Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git commit -m "Migrate CraftCV to ResumeMakery with clean SEO routes"
          git push origin HEAD:brand/resumemakery-migration
